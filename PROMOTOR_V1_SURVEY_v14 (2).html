.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.spacer{flex:1}.search{min-width:240px}input,select,textarea{border:1px solid #d5dce7;background:#fff;border-radius:7px;padding:8px 10px;height:36px;font:inherit;font-size:12px}textarea{height:90px;width:100%}

.cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}.card small{color:var(--muted)}.card strong{display:block;font-size:25px;margin-top:5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:15px;overflow:hidden}.panelhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.panelbody{padding:15px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:900px;font-size:11px}th{background:#f7f9fb;color:#657187;text-transform:uppercase;font-size:9px;letter-spacing:.4px;text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}td{padding:9px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}.toggle-disabled{opacity:.45;cursor:not-allowed;pointer-events:none}.toggle-active{background:var(--green)!important;color:#fff!important}.btn.toggle-off{background:#edf1f6;color:#334155;border:1px solid #d5dce7}.btn.toggle-on{background:var(--green);color:#fff;border:1px solid var(--green)}tr:hover td{background:#fbfcfe}.filter th{background:#fff;padding:4px}.filter input{height:28px;width:100%;min-width:70px;font-size:10px}

.action{display:flex;gap:5px}.dots{width:30px;height:30px;border:0;border-radius:7px;background:#edf1f6;font-weight:bold}.dropdown{position:relative}.menu{display:none;position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 22px #0002;border-radius:8px;padding:4px;z-index:30;min-width:140px}.menu.show{display:block}.menu button{width:100%;display:block;border:0;background:#fff;text-align:left;padding:8px;border-radius:5px;font-size:11px}.menu button:hover{background:#f1f4f8}
.notice{padding:10px 12px;background:#eef5ff;color:#315fa8;border-radius:8px;font-size:11px;margin-bottom:12px}.empty{padding:45px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.modalbg{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:center;justify-content:center;padding:18px}.modalbg.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:12px}.mhead,.mfoot{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:7px}.mbody{padding:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:10px;font-weight:bold;color:var(--muted);margin-bottom:5px}.upload{border:1.5px dashed #b9c4d4;border-radius:9px;padding:25px;text-align:center}.upload span{display:block;color:var(--muted);font-size:11px;margin:6px 0 12px}
@media(max-width:800px){aside{display:none}aside.open{display:block;width:270px;box-shadow:8px 0 30px #0005}main{margin:0;width:100%;padding:16px}.mobile{display:flex;background:var(--navy);color:#fff;margin:-16px -16px 18px;padding:13px;align-items:center;gap:10px}.mobile button{border:0;background:none;color:#fff;font-size:22px}.cardgrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}

.vendor-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.vendor-head .head{margin-bottom:0}.vendor-select{width:187px}.vendor-panel{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}.vendor-panel h3{font-size:14px;margin:0}.vendor-panel .vbody{padding:13px 14px}.vendor-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.vendor-toolbar select{width:188px}.vendor-table{width:100%;min-width:0;font-size:10px}.vendor-table th{font-size:9px;text-transform:none;letter-spacing:0;color:#111827;background:#fff;padding:8px 7px}.vendor-table td{font-size:10px;padding:9px 7px}.vendor-table input[type=number]{width:203px;height:29px;padding:6px 8px}.vendor-table input[type=checkbox]{accent-color:#2563eb}.vendor-status{font-size:9px;padding:4px 8px;border-radius:12px;display:inline-block;white-space:nowrap}.vendor-status.done{background:#e6f6ef;color:#087457}.vendor-status.partial{background:#fff1c9;color:#a06a00}.vendor-status.ready{background:#eaf1ff;color:#315fa8}.vendor-status.none{background:#edf0f4;color:#687386}.vendor-upload{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.vendor-upload input[type=text]{width:203px}.vendor-upload input[type=file]{font-size:11px}.vendor-upload .file-note{color:#687386;font-size:10px}.vendor-history th{text-transform:none;font-size:9px;color:#111827}.vendor-history td{font-size:10px}.vendor-check{width:13px;height:13px}.vendor-section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.vendor-section-title small{color:#687386;font-size:10px}.vendor-confirm{background:#e6f6ef;color:#087457;border:0;border-radius:12px;padding:4px 8px;font-size:9px;display:inline-block;cursor:pointer}.vendor-verify-btn{background:var(--orange);color:#fff;border:0;border-radius:12px;padding:5px 10px;font-size:9px;font-weight:700;cursor:pointer}.vendor-proof-btn:hover,.vendor-verify-btn:hover{filter:brightne .analysis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.analysis-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.analysis-card h3{margin:0 0 4px;font-size:14px}.analysis-card p{margin:0 0 14px;color:var(--muted);font-size:11px}.chart-bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 2px 0}.chart-bar-item{flex:1;min-width:55px;text-align:center;cursor:pointer}.chart-bar{height:105px;display:flex;align-items:flex-end;justify-content:center}.chart-bar span{display:block;width:32px;min-height:5px;border-radius:6px 6px 2px 2px;background:#d7dee9;transition:.18s}.chart-bar-item:hover .chart-bar span,.chart-bar-item.active .chart-bar span{background:var(--orange);transform:translateY(-2px)}.chart-value{font-weight:700;font-size:13px;margin-bottom:5px}.chart-label{font-size:10px;color:var(--muted);line-height:1.25}.critical-list{display:grid;gap:8px;max-height:180px;overflow:auto}.critical-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 95px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:11px;cursor:pointer}.critical-row:hover{background:#faf7ef}.critical-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.critical-qty{text-align:right;font-weight:700}.critical-row .badge{justify-self:end}.analysis-filter{margin-top:8px;font-size:11px;color:var(--muted)}.upload-actions{display:flex;gap:8px;align-items:center}.upload-note{font-size:11px;color:var(--muted);margin-top:6px}.sla-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.sla-pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff;font-size:11px;cursor:pointer}.sla-pill.active{border-color:var(--orange);background:#fff7e8}.chart-bar-item:focus,.critical-row:focus,.sla-pill:focus{outline:2px solid #f5b642;outline-offset:2px}@media(max-width:900px){.analysis{grid-template-columns:1fr}}

manual-note{font-size:10px;color:var(--muted);margin-top:5px}.readonly{background:#f7f9fb!important}.status-track{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.status-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}.status-dot.active{background:var(--blue)}.status-dot.done{background:var(--green)}@media(max-width:1050px){.survey-layout{grid-template-columns:1fr}.survey-side{position:static}}

let daftung=DATA.daftung,gudang=DATA.gudang,workorder=DATA.workorder;
function matStock(code){
 const r=gudang.find(x=>String(x.material)===String(code));
 const n=Number(r?.fisik);
 return Number.isFinite(n)?n:0;
}
function woProgress(w){
 const total=w._materials.reduce((s,m)=>s+m.required,0);
 const reserved=w._materials.reduce((s,m)=>s+Math.min(m.reserved,m.required),0);
 return total?Math.round(reserved/total*100):0;
}
function stockStatus(m){
 const available=Math.max(0,matStock(m.code)-m.reserved);
 if(available>=Math.max(0,m.required-m.reserved)) return 'ok';
 if(available>0) return 'warn';
 return 'bad';
}
function statusLabel(s){
 return s==='ok'?'<span class="badge ok">Cukup</span>':s==='warn'?'<span class="badge warn">Kurang Sebagian</span>':'<span class="badge bad">Tidak Cukup</span>';
}

const menus=[['daftung','DAFTUNG'],['material','KEB MATERIAL'],['gudang','GUDANG'],['wo','WORK ORDER'],['pengawasan','PENGAWASAN'],['vendor','VENDOR']];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shell(title,desc,body){main.innerHTML='<div class="mobile"><button onclick="side.classList.toggle(\'open\')">☰</button><b>PROMOTOR V1.0</b></div><div class="head"><h1>'+title+'</h1><p>'+desc+'</p></div>'+body}
function table(id,heads,rows){rows=Array.isArray(rows)?rows:[rows];return '<div class="tablewrap"><table id="'+id+'"><thead><tr>'+heads.map((h,i)=>'<th onclick="sortTable(\''+id+'\','+i+')">'+esc(h)+' ↕</th>').join('')+'</tr><tr class="filter">'+heads.map(()=>'<th><input placeholder="Filter..." oninput="filterTable(\''+id+'\')"></th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function sortTable(id,c){let t=$(id),b=t.tBodies[0],rs=[...b.rows],d=t.dataset.d==='a'?'d':'a';rs.sort((x,y)=>x.cells[c].innerText.localeCompare(y.cells[c].innerText,'id',{numeric:true})*(d==='a'?1:-1));rs.forEach(r=>b.appendChild(r));t.dataset.d=d}
function filterTable(id){let t=$(id),fs=[...t.querySelectorAll('.filter input')];[...t.tBodies[0].rows].forEach(r=>r.style.display=fs.every((f,i)=>!f.value||r.cells[i].innerText.toLowerCase().includes(f.value.toLowerCase()))?'':'none')}
function search(id,q){[...$(id).tBodies[0].rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function exportTable(id,name){let t=$(id).cloneNode(true);t.querySelectorAll('.filter').forEach(x=>x.remove());let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<html><meta charset="UTF-8"><body>'+t.outerHTML+'</body></html>'],{type:'application/vnd.ms-excel'}));a.download=name+'.xls';a.click()}
function modal(title,body,foot){mtitle.textContent=title;mbody.innerHTML=body;mfoot.innerHTML=foot||'';mbg.classList.add('show')}function closeModal(){mbg.classList.remove('show')}

function parseTargetDays(v){const m=String(v||'').match(/(\d+)\s*Hari/i);return m?Number(m[1]):null}
function slaInfo(r){const target=parseTargetDays(r.KRITERIA_TMP);const dur=Number(r.DURASI_HARI_KERJA)||0;if(target===null)return {target:null,dur,remaining:null,status:'monitor'};const remaining=target-dur;let status=remaining<0?'over':remaining<=3?'near':remaining<=7?'watch':'safe';return {target,dur,remaining,status}}
function slaLabel(st){return st==='over'?'<span class="badge bad">Lewat SLA</span>':st==='near'?'<span class="badge warn">Mendekati SLA</span>':st==='watch'?'<span class="badge warn">Pantau</span>':'<span class="badge ok">Masih Aman</span>'}
function daftungSlaStats(){const a=daftung.map(slaInfo);return {over:a.filter(x=>x.status==='over').length,near:a.filter(x=>x.status==='near').length,watch:a.filter(x=>x.status==='watch').length,safe:a.filter(x=>x.status==='safe').length,monitor:a.filter(x=>x.status==='monitor').length}}
function renderDaftungAnalysis(){const st=daftungSlaStats();const cats=[['Lewat SLA','over',st.over],['≤ 3 Hari','near',st.near],['4–7 Hari','watch',st.watch],['> 7 Hari','safe',st.safe],['Tanpa Target','monitor',st.monitor]];const max=Math.max(1,...cats.map(x=>x[2]));const critical=daftung.map((r,i)=>({r,i,s:slaInfo(r)})).filter(x=>x.s.status==='over'||x.s.status==='near').sort((a,b)=>(a.s.remaining??999)-(b.s.remaining??999)).slice(0,8);return '<div class="analysis"><div class="analysis-card"><h3>Analisis SLA Daftung</h3><p>Prioritas otomatis berdasarkan sisa hari terhadap kriteria TMP.</p><div class="sla-strip">'+cats.map(c=>'<button class="sla-pill" onclick="filterSla(\''+c[1]+'\')">'+c[0]+' · '+c[2]+'</button>').join('')+'</div><div class="chart-bars">'+cats.map(c=>'<div class="chart-bar-item" tabindex="0" onclick="filterSla(\''+c[1]+'\')"><div class="chart-value">'+c[2]+'</div><div class="chart-bar"><span style="height:'+Math.max(6,Math.round(c[2]/max*100))+'px"></span></div><div class="chart-label">'+c[0]+'</div></div>').join('')+'</div><div class="analysis-filter" id="slaFilterInfo">Klik kategori untuk memfilter tabel.</div></div><div class="analysis-card"><h3>Daftung yang Perlu Perhatian</h3><p>Menampilkan yang sudah lewat atau tersisa maksimal 3 hari dari SLA.</p><div class="critical-list">'+(critical.length?critical.map(x=>'<div class="critical-row" tabindex="0" onclick="detailDaftung('+x.i+')"><div class="critical-name"><b>'+esc(x.r.NAMA)+'</b><br><span>'+esc(x.r.IDPEL)+' · '+esc(x.r['NO WO']||'Tanpa WO')+'</span></div><div class="critical-qty">'+(x.s.remaining<0?Math.abs(x.s.remaining)+' hari lewat':x.s.remaining+' hari lagi')+'</div><div>'+slaLabel(x.s.status)+'</div></div>').join(''):'<div class="notice">Tidak ada Daftung yang masuk kategori prioritas.</div>')+'</div></div>'}
function filterSla(kind){const t=$('dTable');if(!t)return;[...t.tBodies[0].rows].forEach((r,i)=>{const st=slaInfo(daftung[i]).status;r.style.display=(kind==='all'||st===kind)?'':'none'});const info=$('slaFilterInfo');if(info)info.textContent='Filter SLA aktif: '+({over:'Lewat SLA',near:'Mendekati SLA',watch:'Pantau',safe:'Masih Aman',monitor:'Tanpa Target'}[kind]||kind)+'. Klik kategori lain untuk mengganti.'}
function pageDaftung(){
 let rows=daftung.map((r,i)=>{const s=slaInfo(r);return '<tr><td><b>'+esc(r.IDPEL)+'</b></td><td>'+esc(r.NAMA)+'</td><td>'+esc(r.ALAMAT)+'</td><td>'+esc(r.TARIF||'')+'</td><td>'+esc(r.DAYA||'')+'</td><td>'+esc(r.JENIS_TRANSAKSI)+'</td><td>'+esc(r['NO WO'])+'</td><td>'+esc(r['PENYEDIA JASA'])+'</td><td>'+esc(r.PENGAWAS)+'</td><td>'+esc(r.TGLBAYAR)+'</td><td>'+esc(r.DURASI_HARI_KERJA)+'</td><td>'+esc(r.KRITERIA_TMP)+'</td><td>'+slaLabel(s.status)+'</td><td>'+esc(r.NAMAUP)+'</td><td><div class="dropdown"><button class="dots" onclick="toggleMenu(this)">⋮</button><div class="menu"><button onclick="detailDaftung('+i+')">Detail</button><button onclick="go(\'wo\')">Lihat WO</button></div></div></td></tr>'});
 const st=daftungSlaStats();
 shell('DAFTUNG','Data pelanggan dan transaksi dari sheet DAFTUNG. Fokus analisis pada Daftung yang mendekati dan melewati SLA.',
 '<div class="cardgrid"><div class="card"><small>Total Daftung</small><strong>'+daftung.length+'</strong></div><div class="card"><small>Lewat SLA</small><strong>'+st.over+'</strong></div><div class="card"><small>Mendekati SLA</small><strong>'+st.near+'</strong></div><div class="card"><small>WO Terisi</small><strong>'+daftung.filter(x=>x['NO WO']).length+'</strong></div></div><div class="toolbar"><button class="btn green" onclick="openDaftungUpload()">Upload Excel</button><input class="search" placeholder="Cari IDPEL, nama, WO, vendor..." oninput="search(\'dTable\',this.value)"><span class="spacer"></span><button class="btn orange" onclick="exportTable(\'dTable\',\'DAFTUNG\')">Export Excel</button></div>'+renderDaftungAnalysis()+table('dTable',['IDPEL','NAMA','ALAMAT','TARIF','DAYA','JENIS TRANSAKSI','NO WO','PENYEDIA JASA','PENGAWAS','TGL BAYAR','DURASI HARI','KRITERIA TMP','STATUS SLA','NAMAUP','ACTION'],rows));
}

function materialAnalysis(){const map={};workorder.forEach(w=>(w._materials||[]).forEach(m=>{if(!map[m.code])map[m.code]={code:m.code,name:m.name,unit:m.unit,woNeed:0,reserved:0};map[m.code].woNeed+=Number(m.required)||0;map[m.code].reserved+=Number(m.reserved)||0}));const arr=Object.values(map).map(m=>{const stock=matStock(m.code),remaining=Math.max(0,m.woNeed-m.reserved),available=Math.max(0,stock-m.reserved),gap=Math.max(0,remaining-stock);return {...m,stock,remaining,available,gap,status:available>=remaining?'ok':available>0?'warn':'bad'}});const c=[['Cukup','ok',arr.filter(x=>x.status==='ok').length],['Menipis / Kurang','warn',arr.filter(x=>x.status==='warn').length],['Habis / Tidak Cukup','bad',arr.filter(x=>x.status==='bad').length]];const max=Math.max(1,...c.map(x=>x[2]));const critical=arr.filter(x=>x.status!=='ok').sort((a,b)=>b.gap-a.gap).slice(0,10);return '<div class="analysis"><div class="analysis-card"><h3>Status Ketersediaan Material</h3><p>Klik kategori untuk memfilter tabel kebutuhan material.</p><div class="chart-bars">'+c.map(x=>'<div class="chart-bar-item" tabindex="0" onclick="filterMaterialStatus(\''+x[1]+'\')"><div class="chart-value">'+x[2]+'</div><div class="chart-bar"><span style="height:'+Math.max(6,Math.round(x[2]/max*100))+'px"></span></div><div class="chart-label">'+x[0]+'</div></div>').join('')+'</div><div class="analysis-filter" id="matFilterInfo">Fokus utama: material warning, menipis, atau habis.</div></div><div class="analysis-card"><h3>Material Prioritas</h3><p>Urut berdasarkan kekurangan stok terhadap kebutuhan tersisa.</p><div class="critical-list">'+(critical.length?critical.map(x=>'<div class="critical-row" tabindex="0" onclick="focusMaterial(\''+esc(x.code).replace(/\'/g,"\\'")+'\')"><div class="critical-name"><b>'+esc(x.code)+'</b><br><span>'+esc(x.name)+'</span></div><div class="critical-qty">'+(x.gap?x.gap.toLocaleString('id-ID'):'—')+'</div><div>'+statusLabel(x.status)+'</div></div>').join(''):'<div class="notice">Semua material yang dianalisis masih cukup.</div>')+'</div></div></div>'}

function focusMaterial(code){const t=$('needTable');if(!t)return;[...t.tBodies[0].rows].forEach(r=>r.style.display=r.cells[0].innerText.includes(code)?'':'none');const info=$('matFilterInfo');if(info)info.textContent='Menampilkan material: '+code}

   const stock=matStock(m.code);
   const remaining=Math.max(0,m.required-m.reserved);
   const available=Math.max(0,stock-m.reserved);

   return `<tr>

    <td>${remaining.toLocaleString('id-ID')} ${esc(m.unit)}</td>

let reservationDrafts=window.reservationDrafts||{};

function getReservationMaterials(wo){
 if(reservationDrafts[wo]) return reservationDrafts[wo];
 const exact=workorder.find(w=>String(w['NO WO'])===String(wo));
 const source=exact||workorder[0];
 const mats=(source&&source._materials)||[];
 reservationDrafts[wo]=mats.map(m=>({code:m.code,name:m.name,unit:m.unit,required:Number(m.required)||0,reserved:Number(m.reserved)||0,state:'pending'}));
 return reservationDrafts[wo];
}
function reservationRowState(m){
 const stock=matStock(m.code),reserved=Math.max(0,Number(m.reserved)||0);
 if(m.state==='pending') return ['pending','Pending'];
 if(stock>=reserved) return ['ok','Bisa Lanjut'];
 return ['bad','Stok Kurang'];
}
function openSupervisorReservation(wo){
 const mats=getReservationMaterials(wo), row=mats.map((m,idx)=>{
   const stock=matStock(m.code),reserved=Math.max(0,Number(m.reserved)||0),sisa=Math.max(0,stock-reserved),[state,label]=reservationRowState(m);
   let action='';
   if(stock>=reserved){ action='<button class="btn green" onclick="reservationContinue(\''+esc(wo)+'\','+idx+')">Lanjut</button>'; }
   else { action='<button class="btn orange" onclick="reservationEdit(\''+esc(wo)+'\','+idx+')">Edit</button> <button class="btn" onclick="reservationPending(\''+esc(wo)+'\','+idx+')">Pending</button>'; }
   const badge=state==='ok'?'<span class="badge ok">'+(m.state==='done'?'Lanjut':'Siap')+'</span>':state==='pending'?'<span class="badge warn">Pending</span>':'<span class="badge bad">Stok Kurang</span>';
   return '<tr><td><b>'+esc(m.name)+'</b><div style="font-size:11px;color:#7a8496">Kode '+esc(m.code)+'</div></td><td>'+esc(m.unit)+'</td><td>'+reserved.toLocaleString('id-ID')+'</td><td>'+stock.toLocaleString('id-ID')+'</td><td>'+sisa.toLocaleString('id-ID')+'</td><td>'+badge+'</td><td>'+action+'</td></tr>';

}

async function readSpreadsheetFile(file,preferredSheet){const ext=(file.name.split('.').pop()||'').toLowerCase();if(ext==='csv'){const text=await file.text();return parseCSVObjects(text,preferredSheet)}let XLSX=window.XLSX;if(!XLSX){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Library Excel tidak dapat dimuat. Coba gunakan CSV atau pastikan internet aktif.'));document.head.appendChild(sc)});XLSX=window.XLSX}const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const name=wb.SheetNames.find(n=>String(n).trim().toUpperCase()===preferredSheet)||wb.SheetNames[0];if(!name)throw new Error('Sheet tidak ditemukan.');const ws=wb.Sheets[name];const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});let headerIndex=0;if(preferredSheet==='GUDANG'){headerIndex=matrix.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==='material')&&r.some(c=>String(c).trim().toLowerCase().includes('description')));if(headerIndex<0)headerIndex=matrix.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==='material'));if(headerIndex<0)headerIndex=0}const headers=matrix[headerIndex].map(x=>String(x).trim());return matrix.slice(headerIndex+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??'');return normalizeImportedRow(o,preferredSheet)}).filter(Boolean)}

function syncSurveyStep(){const r=surveyDraft.record;const val=id=>$(id)?.value??'';if(surveyDraft.step===0){r.customer={...r.customer,idpel:val('s_idpel').trim(),name:val('s_name').trim(),address:val('s_address'),daya:val('s_daya'),tarif:val('s_tarif'),jenis:val('s_jenis')}}if(surveyDraft.step===1){r.technical={...r.technical,pelangganKhusus:val('s_khusus'),ulp:val('s_ulp'),tipeGardu:val('s_gardu'),kapasitasTrafo:val('s_trafo'),jumlahKabelNaik:val('s_kabel'),penyulang:val('s_penyulang')}}if(surveyDraft.step===2){r.location={...r.location,address:val('s_locaddr'),lat:val('s_lat'),lng:val('s_lng')}}}
function surveyNext(){syncSurveyStep();const r=surveyDraft.record;if(surveyDraft.step===0&&!r.customer.name){alert('Nama pelanggan wajib diisi.');return}if(surveyDraft.step<4){surveyDraft.step++;pageSurveyForm()}}

function surveySaveDraft(){syncSurveyStep();surveyDraft.record.updated=new Date().toISOString().slice(0,10);const idx=surveys.findIndex(s=>s.id===surveyDraft.record.id);if(idx>=0)surveys[idx]=surveyDraft.record;else surveys.push(surveyDraft.record);alert('Draft Survey tersimpan.');go('survey')}
function submitSurvey(){syncSurveyStep();const r=surveyDraft.record;if(!r.customer.name){alert('Nama pelanggan wajib diisi.');surveyDraft.step=0;pageSurveyForm();return}if(!r.materials.length){alert('Minimal pilih 1 material sebelum submit Survey.');surveyDraft.step=3;pageSurveyForm();return}r.status='Selesai';r.updated=new Date().toISOString().slice(0,10);const idx=surveys.findIndex(s=>s.id===r.id);if(idx>=0)surveys[idx]=r;else surveys.push(r);alert('Survey '+r.id+' selesai. Admin dapat memasukkannya ke Daftung.');go('survey')}

function openApplyWO(i){const r=daftung[i];const s=r.SURVEY_ID?surveys.find(x=>x.id===r.SURVEY_ID):null;const mats=s?s.materials:[];if(r['NO WO']){alert('Daftung ini sudah memiliki WO.');return}modal('Apply WO · '+(r.NAMA||''),'<div class="notice">Material dari Survey hanya menjadi <b>baseline</b>. Saat WO dibuat, Admin dapat meninjau dan mengubah material. Pengawas juga dapat mengedit material setelah WO dibuat.</div><div class="formgrid"><div><label>Pelanggan</label><input class="readonly" readonly value="'+esc(r.NAMA)+'"></div><div><label>Sumber</label><div style="padding-top:8px">'+daftungSourceBadge(r)+'</div></div><div><label>Vendor *</label><select id="awo_vendor"><option>PT. TRI STARS NUSANTARA</option><option>PT Fakhri Putra Utama</option><option>PT Datu Nahima Teknik</option><option>PT Lynard Power Kontraktor</option><option>PT Tawakal Karya Teknik</option></select></div><div><label>Pengawas 1</label><select id="awo_sup1"><option>Faisal Reza</option><option>Winnetou Chandra</option><option>Hasian Sitorus</option><option>Yadi Triyadi</option><option>Rizki Wahyu</option></select></div><div><label>Pengawas 2</label><select id="awo_sup2"><option>Daud Febriansyah</option><option>RIZKI</option><option>Faisal Reza</option><option>Winnetou Chandra</option><option>Hasian Sitorus</option></select></div></div><div class="panel" style="margin-top:15px"><div class="panelhead"><b>Material Baseline dari Survey</b><span>'+mats.length+' item</span></div><div class="tablewrap"><table style="min-width:700px"><thead><tr><th>Material</th><th>Qty Survey</th><th>Satuan</th></tr></thead><tbody>'+(mats.length?mats.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.qty)+'</td><td>'+esc(m.unit)+'</td></tr>').join(''):'<tr><td colspan="3">Daftung manual belum memiliki material baseline. Material dapat ditambahkan setelah WO dibuat.</td></tr>')+'</tbody></table></div></div>','<button class="btn" onclick="closeModal()">Batal</button><button class="btn green" onclick="createWOFromDaftung('+i+')">Buat WO</button>')}
function createWOFromDaftung(i){const r=daftung[i];const s=r.SURVEY_ID?surveys.find(x=>x.id===r.SURVEY_ID):null;const mats=(s?.materials||[]).map(m=>({code:m.code,name:m.name,unit:m.unit,required:Number(m.qty)||0,reserved:0,verified:0}));const no='WO-'+String(workorder.length+1).padStart(3,'0');const w={"NAMA PELANGGAN":r.NAMA,"NO WO":no,"VENDOR":$('awo_vendor')?.value||'PT. TRI STARS NUSANTARA',"PENGAWAS":($('awo_sup1')?.value||''),"PENGAWAS_2":($('awo_sup2')?.value||''),"PROGRESS MATERIAL (%)":'0',"ACTION":'EDIT, DELETE',"KET KENDALA":'',_dt:r.DAFTUNG_ID||'',_survey:r.SURVEY_ID||'',_materials:mats};workorder.push(w);r['NO WO']=no;r['PENYEDIA JASA']=w.VENDOR;r.PENGAWAS=w.PENGAWAS;r.STATUS_DAFTUNG='WO Dibuat';r.SURVEY_ID=r.SURVEY_ID||'';closeModal();alert('WO '+no+' berhasil dibuat dari '+(r.SURVEY_ID||'Daftung Manual')+'.');go('daftung')}

function woVerifiedProgress(w){const total=(w._materials||[]).reduce((s,m)=>s+(Number(m.required)||0),0);const got=(w._materials||[]).reduce((s,m)=>s+Math.min(Number(m.verified)||0,Number(m.required)||0),0);return total?Math.round(got/total*100):0}
function pageWO(){const rows=workorder.map((r,i)=>{const p=woVerifiedProgress(r);return '<tr><td>'+esc(r['NAMA PELANGGAN'])+'</td><td><b>'+esc(r['NO WO'])+'</b></td><td>'+esc(r.VENDOR)+'</td><td>'+esc(r.PENGAWAS)+'<br><span style="color:var(--muted)">'+esc(r.PENGAWAS_2||'-')+'</span></td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress"><i style="width:'+p+'%"></i></div><b>'+p+'%</b></div></td><td>'+esc(r['KET KENDALA']||'-')+'</td><td><div class="action"><button class="btn primary" onclick="openWOEditMaterials('+i+')">Material</button><button class="btn" onclick="editWO('+i+')">Edit</button></div></td></tr>'});shell('WORK ORDER','WO dibuat dari Daftung yang di-Apply Admin. Material Survey menjadi baseline dan dapat diedit Admin/Pengawas.', '<div class="cardgrid"><div class="card"><small>Total WO</small><strong>'+workorder.length+'</strong></div><div class="card"><small>WO Berjalan</small><strong>'+workorder.filter(w=>woVerifiedProgress(w)<100).length+'</strong></div><div class="card"><small>WO Selesai</small><strong>'+workorder.filter(w=>woVerifiedProgress(w)>=100).length+'</strong></div><div class="card"><small>Material Verified</small><strong>'+workorder.reduce((n,w)=>n+(w._materials||[]).reduce((a,m)=>a+(Number(m.verified)||0),0),0)+'</strong></div></div><div class="notice">Upload WO tidak lagi menjadi proses normal. Tombol migrasi hanya dipakai untuk data lama. WO baru dibuat melalui <b>DAFTUNG → Apply WO</b>.</div><div class="toolbar"><input class="search" placeholder="Cari pelanggan, WO, vendor..." oninput="search(&quot;woTableNew&quot;,this.value)"><span class="spacer"></span><button class="btn orange" onclick="openWOUpload()">Upload Migrasi</button><button class="btn orange" onclick="exportTable(&quot;woTableNew&quot;,&quot;WORK_ORDER&quot;)">Export Excel</button></div>'+table('woTableNew',['Nama Pelanggan','No WO','Vendor','Pengawas 1 / 2','Progress Verified','Kendala','Action'],rows))}
function openWOEditMaterials(i){const w=workorder[i];const rows=(w._materials||[]).map((m,idx)=>'<tr><td><b>'+esc(m.code)+'</b><br><span style="color:var(--muted)">'+esc(m.name)+'</span></td><td><input id="wreq_'+idx+'" type="number" min="0" value="'+esc(m.required)+'" style="width:100px"></td><td>'+esc(m.unit)+'</td><td>'+esc(m.reserved||0)+'</td><td>'+esc(m.verified||0)+'</td><td><button class="btn red" onclick="removeWOMaterial('+i+','+idx+')">Hapus</button></td></tr>');modal('Material WO · '+w['NO WO'],'<div class="notice">Perubahan material/qty dicatat sebagai perubahan WO. Material Survey tetap menjadi referensi awal.</div><div class="tablewrap"><table style="min-width:800px"><thead><tr><th>Material</th><th>Qty WO</th><th>Satuan</th><th>Reserved</th><th>Verified</th><th>Aksi</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div><div style="margin-top:12px"><button class="btn green" onclick="addWOMaterialPrompt('+i+')">+ Tambah Material</button></div>','<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveWOMaterials('+i+')">Simpan Perubahan</button>')}
function saveWOMaterials(i){const w=workorder[i];(w._materials||[]).forEach((m,idx)=>{const q=Number($('wreq_'+idx)?.value);if(Number.isFinite(q))m.required=Math.max(0,q)});closeModal();pageWO()}

async function importStdExcel(){try{const f=$("stdFile")?.files?.[0];if(!f){alert('Pilih file Excel terlebih dahulu.');return}const ext=(f.name.split('.').pop()||'').toLowerCase();let matrix=[];if(ext==='csv'){const text=await f.text();matrix=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()).map(line=>line.split(line.includes(';')?';':','));}else{let XLSX=window.XLSX;if(!XLSX){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Library Excel tidak dapat dimuat.'));document.head.appendChild(sc)});XLSX=window.XLSX}const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const sn=wb.SheetNames.find(n=>String(n).trim().toUpperCase()==='DATABASE KATEGORI')||wb.SheetNames[0];const ws=wb.Sheets[sn];matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})}if(!matrix.length)throw new Error('File kosong.');const hs=matrix[0].map(x=>String(x||'').trim());if(!hs[0]||!hs[0].toUpperCase().includes('KATEGORI'))throw new Error('Header pertama harus KATEGORI KONSTRUKSI TM.');const mats=hs.slice(1).filter(Boolean);const next=[];for(let r=1;r<matrix.length;r++){const name=String(matrix[r][0]||'').trim();if(!name)continue;const materials={};mats.forEach((m,j)=>{const n=Number(matrix[r][j+1]);materials[m]=Number.isFinite(n)?n:0});const old=stdKonstruksi.find(s=>s.name===name);next.push({name,active:old?old.active:true,materials})}if(!next.length)throw new Error('Tidak ada kategori konstruksi.');stdMaterialHeaders.splice(0,stdMaterialHeaders.length,...mats);stdKonstruksi=next;closeModal();pageStdKonstruksi();alert('STD KONSTRUKSI berhasil diperbarui: '+next.length+' kategori.');}catch(e){alert('Upload gagal: '+e.message)}}
function stdMaterialsForSurvey(r){const agg={};(r.standardIds||[]).forEach(name=>{const s=stdKonstruksi.find(x=>x.name===name);if(!s)return;Object.entries(s.materials).forEach(([code,qty])=>{const q=Number(qty)||0;if(q<=0)return;const g=gudang.find(x=>String(x.material).trim()===String(code).trim());if(!agg[code])agg[code]={code,name:g?.description||code,unit:'pcs',qty:0,note:'',sourceStandards:[],manualAdjusted:false};agg[code].qty+=q;if(!agg[code].sourceStandards.includes(name))agg[code].sourceStandards.push(name)})});return Object.values(agg)}
function applySurveyStandards(){const r=surveyDraft.record;const base=stdMaterialsForSurvey(r);const oldBy=Object.fromEntries((r.materials||[]).map(m=>[m.code,m]));r.materials=base.map(m=>{const old=oldBy[m.code];return old?{...m,qty:old.manualAdjusted?old.qty:m.qty,unit:old.unit||m.unit,note:old.note||'',manualAdjusted:!!old.manualAdjusted}:m});(r.materials||[]).forEach(m=>{if(!m.sourceStandards)m.sourceStandards=[]});}
function toggleSurveyStandard(i,checked){const r=surveyDraft.record;const name=stdKonstruksi[i].name;r.standardIds=r.standardIds||[];if(checked&&!r.standardIds.includes(name))r.standardIds.push(name);if(!checked)r.standardIds=r.standardIds.filter(x=>x!==name);applySurveyStandards();pageSurveyForm();}

  window.importContractMaterialExcel=async function(i){
    const f=$('contractMaterialFile')?.files?.[0];
    if(!f){alert('Pilih file Excel terlebih dahulu.');return}
    try{
      const raw=await readSpreadsheetFile(f,'');
      if(!raw.length){alert('Data material tidak ditemukan.');return}
      const find=(o,keys)=>{const k=Object.keys(o).find(x=>keys.includes(String(x).trim().toUpperCase()));return k?o[k]:''};
      const c=kontrakMaterial[i]; c.materials=c.materials||[];
      let added=0,skipped=0;
      raw.forEach(o=>{
        let code=String(find(o,['MATERIAL','KODE MATERIAL','KODE','MATERIAL CODE','MATERIAL_CODE'])||'').trim();
        let name=String(find(o,['MATERIAL DESCRIPTION','DESCRIPTION','NAMA MATERIAL','NAMA'])||'').trim();
        let qty=Number(String(find(o,['QTY','QUANTITY','JUMLAH','QTY KONTRAK'])||'').replace(/[^0-9.,-]/g,'').replace(/\.(?=.*\.)/g,'').replace(',','.'))||0;

      });

})();

  window.importStdExcelV2=async function(){
    try{
      const f=$('stdFileV2')?.files?.[0]; if(!f){alert('Pilih file Excel terlebih dahulu.');return}
      const mode=document.querySelector('input[name="stdModeV2"]:checked')?.value||'replace';
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      let matrix=[];
      if(ext==='csv'){
        matrix=(await f.text()).replace(/\r/g,'').split('\n').filter(x=>x.trim()).map(line=>line.split(line.includes(';')?';':','));
      }else{
        let X=window.XLSX;
        if(!X){
          await new Promise((resolve,reject)=>{
            const sc=document.createElement('script');
            sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
            sc.onload=resolve; sc.onerror=()=>reject(new Error('Library Excel tidak dapat dimuat.'));
            document.head.appendChild(sc);
          });
          X=window.XLSX;
        }
        const wb=X.read(await f.arrayBuffer(),{type:'array'});
        const sn=wb.SheetNames.find(n=>String(n).trim().toUpperCase()==='DATABASE KATEGORI')||wb.SheetNames[0];
        matrix=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      }
      if(!matrix.length)throw new Error('File kosong.');
      const hs=matrix[0].map(x=>String(x??'').trim());
      if(!hs[0]||!hs[0].toUpperCase().includes('KONSTRUKSI'))throw new Error('Header pertama harus Konstruksi TM.');
      const mats=hs.slice(1).filter(Boolean);
      const incoming=[];
      for(let r=1;r<matrix.length;r++){
        const name=String(matrix[r][0]??'').trim(); if(!name)continue;
        const materials={};
        mats.forEach((m,j)=>{
          const raw=matrix[r][j+1];
          const n=(raw===''||raw==null)?0:Number(raw);
          materials[m]=Number.isFinite(n)?n:0;
        });
        incoming.push({name,active:true,materials});
      }
      if(!incoming.length)throw new Error('Tidak ada kategori konstruksi pada file.');
      if(mode==='replace'){
        stdMaterialHeaders.splice(0,stdMaterialHeaders.length,...mats);
        stdKonstruksi.splice(0,stdKonstruksi.length,...incoming);
      }else{
        mats.forEach(m=>{if(!stdMaterialHeaders.includes(m))stdMaterialHeaders.push(m)});
        incoming.forEach(n=>{
          const old=stdKonstruksi.find(x=>x.name===n.name);
          if(old){
            old.materials={...old.materials,...n.materials};
          }else{
            stdKonstruksi.push(n);
          }
        });
      }
      closeModal(); pageStdKonstruksi();
      alert((mode==='replace'?'Database diganti':'Data ditambahkan/diperbarui')+' berhasil. '+incoming.length+' kategori diproses.');
    }catch(e){alert('Upload gagal: '+e.message)}
  };

  function getStdSelection(r){
    r.standardSelections=Array.isArray(r.standardSelections)?r.standardSelections:[];
    if(!r.standardSelections.length && Array.isArray(r.standardIds)){
      r.standardSelections=r.standardIds.map(name=>({name,qty:1,note:''}));
    }
    return r.standardSelections;
  }

  window.rebuildSurveyMaterialsV2=function(r){
    const sels=getStdSelection(r), agg={};
    sels.forEach(sel=>{
      const s=stdKonstruksi.find(x=>x.name===sel.name); if(!s)return;
      const mult=Math.max(0,Number(sel.qty)||0);
      if(mult<=0)return;
      Object.entries(s.materials||{}).forEach(([code,baseQty])=>{
        const q=(Number(baseQty)||0)*mult; if(q<=0)return;
        const key=String(code).trim();
        if(!agg[key]){
          const g=(gudang||[]).find(x=>String(x.material||'').trim().toUpperCase()===key.toUpperCase());
          agg[key]={code:key,name:g?.description||key,unit:stdUnit(key),qty:0,note:'',sourceStandards:[],manualAdjusted:false};
        }
        agg[key].qty+=q;
        if(!agg[key].sourceStandards.includes(sel.name))agg[key].sourceStandards.push(sel.name);
      });
    });
    r.materials=Object.values(agg);
    r.standardIds=sels.map(x=>x.name);
  };

/* ===== REVISION 12: WORK ORDER / PENGAWASAN PROGRESS SPLIT ===== */
(function(){
  const jasaItems=[
    {key:'tiang',label:'Penanaman Tiang'},
    {key:'konstruksi',label:'Pemasangan Konstruksi Jaringan (Perluasan)'},
    {key:'penarikan',label:'Penarikan Jaringan'},
    {key:'kerangka',label:'Pemasangan Kerangka Gardu'},
    {key:'trafo_app',label:'Pemasangan Trafo + Box APP'}
  ];
  function ensureJasa(w){
    if(!w._jasaProgress) w._jasaProgress={};
    if(!w._jasaWeights) w._jasaWeights={};
    jasaItems.forEach(x=>{
      if(typeof w._jasaProgress[x.key]!=='boolean') w._jasaProgress[x.key]=false;
      if(!Number.isFinite(Number(w._jasaWeights[x.key]))) w._jasaWeights[x.key]=20;
    });
    return w;
  }
  function jasaProgress(w){
    ensureJasa(w);
    return Math.min(100,Math.round(jasaItems.reduce((n,x)=>n+(w._jasaProgress[x.key]?Number(w._jasaWeights[x.key]||20):0),0)));
  }
  function materialProgress(w){return woVerifiedProgress(w)}
  function combinedComplete(w){return materialProgress(w)>=100 && jasaProgress(w)>=100}
  window.jasaProgress=jasaProgress;
  window.materialProgress=materialProgress;
  window.combinedComplete=combinedComplete;
  window.ensureJasa=ensureJasa;

  workorder.forEach((w,i)=>{
    ensureJasa(w);
    if(i===5){jasaItems.forEach(x=>w._jasaProgress[x.key]=true)}
    else if(i===1){w._jasaProgress.tiang=true}
    else if(i===2){w._jasaProgress.tiang=true;w._jasaProgress.penarikan=true}
    else if(i===3){w._jasaProgress.konstruksi=true;w._jasaProgress.kerangka=true}
  });

  function progressBar(p,label,click){
    return '<button class="progress-click" onclick="'+click+'" title="Klik untuk melihat detail progress"><span class="progress-label">'+label+'</span><span class="progress"><i style="width:'+Math.min(100,p)+'%"></i></span><b>'+p+'%</b></button>';
  }
  function openJasaProgress(i){
    const w=ensureJasa(workorder[i]);
    const rows=jasaItems.map((x,idx)=>{
      const checked=!!w._jasaProgress[x.key];
      const weight=Number(w._jasaWeights[x.key]||20);
      return '<tr><td><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleJasaIndicator('+i+',\''+x.key+'\',this.checked)"><b>'+esc(x.label)+'</b></label></td><td><input type="number" min="0" max="100" step="1" value="'+weight+'" style="width:90px" onchange="changeJasaWeight('+i+',\''+x.key+'\',this.value)"> %</td></tr>';
    }).join('');
    modal('Progress Jasa · '+esc(w['NO WO']),
      '<div class="notice">Setiap indikator yang dicentang menambah progress jasa sesuai bobotnya. Default setiap indikator <b>20%</b>, dan bobot dapat diedit oleh Pengawas/Admin.</div>'+
      '<div class="panel"><div class="panelhead"><b>Indikator Progress Pekerjaan</b><span>Progress Jasa: '+jasaProgress(w)+'%</span></div><div class="tablewrap"><table><thead><tr><th>Indikator</th><th>Bobot</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>',
      '<button class="btn" onclick="closeModal();pagePengawasan()">Tutup</button>');
  }
  window.openJasaProgress=openJasaProgress;
  window.toggleJasaIndicator=function(i,key,val){ensureJasa(workorder[i]);workorder[i]._jasaProgress[key]=!!val;closeModal();openJasaProgress(i)};
  window.changeJasaWeight=function(i,key,val){ensureJasa(workorder[i]);let n=Number(val);if(!Number.isFinite(n)||n<0)n=0;workorder[i]._jasaWeights[key]=n;closeModal();openJasaProgress(i)};

  function openMaterialProgressPopup(i){
    const w=workorder[i];
    const rows=(w._materials||[]).map(m=>'<tr><td>'+esc(m.name||m.code)+'</td><td>'+esc(m.required||0)+'</td><td>'+esc(m.verified||0)+'</td><td>'+Math.min(100,Math.round(((Number(m.verified)||0)/(Number(m.required)||1))*100))+'%</td></tr>').join('');

  }
  window.openMaterialProgressPopup=openMaterialProgressPopup;

  window.pageWO=function(){
    const rows=workorder.map((r,i)=>{
      ensureJasa(r); const pm=materialProgress(r), pj=jasaProgress(r), done=combinedComplete(r);
      const bast=done?'<button class="btn green" onclick="openBAST('+i+')">Cetak BAST</button>':'';
      return '<tr><td>'+esc(r['NAMA PELANGGAN'])+'</td><td><b>'+esc(r['NO WO'])+'</b></td><td>'+esc(r.VENDOR)+'</td><td>'+esc(r.PENGAWAS)+'<br><span style="color:var(--muted)">'+esc(r.PENGAWAS_2||'-')+'</span></td><td>'+ (done?'<span class="badge green">Selesai</span>':'<span class="badge">Aktif</span>') +'</td><td><div class="action"><button class="btn primary" onclick="openWOEditMaterials('+i+')">Material</button><button class="btn" onclick="editWO('+i+')">Edit</button>'+bast+'</div></td></tr>';
    });
    shell('WORK ORDER','WO berisi identitas pekerjaan dan material. Monitoring progress material, progress jasa, dan kendala dilakukan di menu PENGAWASAN.',
      '<div class="cardgrid"><div class="card"><small>Total WO</small><strong>'+workorder.length+'</strong></div><div class="card"><small>WO Berjalan</small><strong>'+workorder.filter(w=>!combinedComplete(w)).length+'</strong></div><div class="card"><small>WO Selesai</small><strong>'+workorder.filter(w=>combinedComplete(w)).length+'</strong></div><div class="card"><small>Material Verified</small><strong>'+workorder.reduce((n,w)=>n+(w._materials||[]).reduce((a,m)=>a+(Number(m.verified)||0),0),0)+'</strong></div></div>'+
      '<div class="notice">Kolom <b>Progress Material, Progress Jasa, dan Kendala</b> dipindahkan ke PENGAWASAN. WO dianggap selesai jika <b>Progress Material 100% dan Progress Jasa 100%</b>.</div>'+
      '<div class="toolbar"><input class="search" placeholder="Cari pelanggan, WO, vendor..." oninput="search(\"woTableRevision12\",this.value)"><span class="spacer"></span><button class="btn orange" onclick="openWOUpload()">Upload Migrasi</button><button class="btn orange" onclick="exportTable(\"woTableRevision12\",\"WORK_ORDER\")">Export Excel</button></div>'+
      table('woTableRevision12',['Nama Pelanggan','No WO','Vendor','Pengawas 1 / 2','Status','Action'],rows));
  };

  window.pagePengawasan=function(){
    const names=[...new Set(workorder.flatMap(w=>[w.PENGAWAS,w.PENGAWAS_2]).filter(Boolean))];
    const selected=names[0]||'';
    shell('PENGAWASAN','Monitoring progress material, progress jasa, dan kendala per Pengawas. Klik progress jasa untuk checklist pekerjaan.',
      '<div class="cardgrid"><div class="card"><small>Total Pengawas</small><strong>'+names.length+'</strong></div><div class="card"><small>Total WO</small><strong>'+workorder.length+'</strong></div><div class="card"><small>WO Selesai</small><strong>'+workorder.filter(w=>combinedComplete(w)).length+'</strong></div><div class="card"><small>Rata-rata Jasa</small><strong>'+ (workorder.length?Math.round(workorder.reduce((s,w)=>s+jasaProgress(w),0)/workorder.length):0)+'%</strong></div></div>'+ 
      '<div class="toolbar"><label style="margin:0">Pilih Pengawas</label><select id="supSelect12" onchange="renderSupervisorTableV12(this.value)">'+names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></div><div id="supTable12"></div>');
    renderSupervisorTableV12(selected);
  };
  window.renderSupervisorTableV12=function(name){
    const rows=workorder.filter(w=>w.PENGAWAS===name||w.PENGAWAS_2===name).map((w)=>{const i=workorder.indexOf(w);ensureJasa(w);const pm=materialProgress(w),pj=jasaProgress(w),done=combinedComplete(w);return '<tr><td>'+esc(w['NAMA PELANGGAN'])+'</td><td><b>'+esc(w['NO WO'])+'</b></td><td>'+esc(w.VENDOR)+'</td><td>'+esc(w.PENGAWAS)+'<br>'+esc(w.PENGAWAS_2||'-')+'</td><td>'+progressBar(pm,'Material','openMaterialProgressPopup('+i+')')+'</td><td>'+progressBar(pj,'Jasa','openJasaProgress('+i+')')+'</td><td><div style="min-width:180px"><input value="'+esc(w['KET KENDALA']||'')+'" placeholder="Tulis kendala..." onblur="updateWOKendala('+i+',this.value)"></div></td><td><div class="action"><button class="btn primary" onclick="openReservationForWO(\''+esc(w['NO WO'])+'\')">Reservasi</button><button class="btn" onclick="openJasaProgress('+i+')">Progress Jasa</button>'+ (done?'<button class="btn green" onclick="openBAST('+i+')">BAST</button>':'') +'</div></td></tr>'}).join('');
    $('supTable12').innerHTML=table('supInner12',['Pelanggan','No WO','Vendor','Pengawas 1 / 2','Progress Material','Progress Jasa','Kendala','Action'],rows);

    const poles=surveyPoleMaterials(s);

    const tiangRows=poles.map((m,idx)=>({code:m.code,name:m.name,unit:m.unit,qtySurvey:m.surveyQty,qtyWO:Math.max(0,Number($('awo_tiang_qty_'+idx)?.value)||0),vendor:vendorTiang,installedQty:0,verifiedQty:0,progress:0})).filter(x=>x.qtyWO>0);
    const no='WO-'+String(workorder.length+1).padStart(3,'0');
    const w={'NAMA PELANGGAN':r.NAMA,'NO WO':no,'VENDOR':$('awo_vendor')?.value||'PT. TRI STARS NUSANTARA','PENGAWAS':$('awo_sup1')?.value||'','PENGAWAS_2':$('awo_sup2')?.value||'','PROGRESS MATERIAL (%)':'0','ACTION':'EDIT, DELETE','KET KENDALA':'',_dt:r.DAFTUNG_ID||'',_survey:r.SURVEY_ID||'',_idpel:r.IDPEL,_status:'Aktif',_materials:mats,_bast:{conditions:{},asmanKonstruksi:'',asmanJaringan:''},_kontrakJasa:cno,_nilaiJasa:nilai,_vendorTiang:vendorTiang,_tiangRows:tiangRows,_tiangProgress:0};
    workorder.push(w); r['NO WO']=no; r['PENYEDIA JASA']=w.VENDOR; r.PENGAWAS=w.PENGAWAS; r.STATUS_DAFTUNG='WO Proses'; r.STATUS_MONITORING='WO Proses';
    closeModal(); alert('WO '+no+' berhasil dibuat. Vendor Tiang: '+(vendorTiang||'belum dipilih')+'.'); go('daftung');
  };

  // Vendor Tiang master and progress sub-menu inside VENDOR.
  const _legacyPageVendor=pageVendor;
  window.pageVendor=function(){
    shell('VENDOR','Pengambilan material, Master Vendor Tiang, dan progress pemasangan tiang.',
      '<div class="tabs" style="margin-bottom:15px"><button id="vtabPickup" class="btn primary" onclick="showVendorSubTab(\'pickup\')">Pengambilan Material</button><button id="vtabTiang" class="btn" onclick="showVendorSubTab(\'tiang\')">Vendor Tiang</button></div><div id="vendorSubBody"></div>');
    showVendorSubTab('pickup');
  };
  window.showVendorSubTab=function(tab){
    const body=$('vendorSubBody'); if(!body)return;
    const p=$('vtabPickup'),t=$('vtabTiang'); if(p)p.className='btn'+(tab==='pickup'?' primary':''); if(t)t.className='btn'+(tab==='tiang'?' primary':'');
    if(tab==='pickup'){
      // Reuse the existing vendor UI and then place it inside the current body.
      const oldMain=main.innerHTML; _legacyPageVendor(); const generated=main.innerHTML; shell('VENDOR','Pengambilan material, Master Vendor Tiang, dan progress pemasangan tiang.', '<div class="tabs" style="margin-bottom:15px"><button id="vtabPickup" class="btn primary" onclick="showVendorSubTab(\'pickup\')">Pengambilan Material</button><button id="vtabTiang" class="btn" onclick="showVendorSubTab(\'tiang\')">Vendor Tiang</button></div><div id="vendorSubBody">'+generated+'</div>'); return;
    }
    const vendorOptions=vendorTiangMaster.map((v,i)=>'<tr><td>'+esc(v)+'</td><td><button class="btn" onclick="editVendorTiang('+i+')">Edit</button> <button class="btn" onclick="removeVendorTiang('+i+')">Hapus</button></td></tr>').join('');
    const woOptions=workorder.filter(w=>(w._tiangRows||[]).length).map((w,i)=>'<option value="'+esc(w['NO WO'])+'">'+esc(w['NO WO'])+' — '+esc(w['NAMA PELANGGAN'])+'</option>').join('');
    body.innerHTML='<div class="panel"><div class="panelhead"><b>Master Vendor Tiang</b><button class="btn green" onclick="addVendorTiang()">+ Vendor Tiang</button></div><div class="tablewrap"><table><thead><tr><th>Nama Vendor Tiang</th><th>Action</th></tr></thead><tbody>'+(vendorOptions||'<tr><td colspan="2">Belum ada vendor.</td></tr>')+'</tbody></table></div></div>'+ 
      '<div class="panel" style="margin-top:15px"><div class="panelhead"><b>Progress Pemasangan Tiang</b><span>Vendor menginput, Pengawas memverifikasi</span></div><div class="formgrid"><div><label>Pilih WO</label><select id="vtProgressWO" onchange="renderTiangVendorProgress()">'+(woOptions||'<option value="">Belum ada WO dengan tiang</option>')+'</select></div></div><div id="vtProgressBody" style="margin-top:12px"></div></div>';
    renderTiangVendorProgress();
  };
  window.addVendorTiang=function(){modal('Tambah Vendor Tiang','<div><label>Nama Vendor Tiang *</label><input id="newVTName" placeholder="Nama vendor tiang"></div>','<button class="btn" onclick="closeModal()">Batal</button><button class="btn green" onclick="saveNewVendorTiang()">Simpan</button>')};
  window.saveNewVendorTiang=function(){const v=($('newVTName')?.value||'').trim();if(!v){alert('Nama vendor wajib diisi.');return}if(vendorTiangMaster.includes(v)){alert('Vendor sudah ada.');return}vendorTiangMaster.push(v);closeModal();showVendorSubTab('tiang')};
  window.editVendorTiang=function(i){modal('Edit Vendor Tiang','<div><label>Nama Vendor Tiang *</label><input id="editVTName" value="'+esc(vendorTiangMaster[i]||'')+'"></div>','<button class="btn" onclick="closeModal()">Batal</button><button class="btn green" onclick="saveEditVendorTiang('+i+')">Simpan</button>')};
  window.saveEditVendorTiang=function(i){const v=($('editVTName')?.value||'').trim();if(!v)return;vendorTiangMaster[i]=v;closeModal();showVendorSubTab('tiang')};
  window.removeVendorTiang=function(i){if(confirm('Hapus vendor tiang ini?')){vendorTiangMaster.splice(i,1);showVendorSubTab('tiang')}};
  window.renderTiangVendorProgress=function(){
    const woNo=$('vtProgressWO')?.value||''; const w=workorder.find(x=>x['NO WO']===woNo); const body=$('vtProgressBody'); if(!body)return;
    if(!w){body.innerHTML='<div class="empty">Belum ada WO dengan material tiang.</div>';return}
    const rows=(w._tiangRows||[]).map((t,i)=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.vendor)+'</td><td>'+esc(t.qtyWO)+'</td><td><input type="number" min="0" max="'+esc(t.qtyWO)+'" value="'+esc(t.installedQty||0)+'" style="width:100px" onchange="updateTiangInstalled('+workorder.indexOf(w)+','+i+',this.value)"></td><td>'+Math.min(100,Math.round(((Number(t.installedQty)||0)/(Number(t.qtyWO)||1))*100))+'%</td><td><span class="badge '+(t.verified?'ok':'warn')+'">'+(t.verified?'Terverifikasi':'Menunggu Verifikasi')+'</span></td><td><button class="btn '+(t.verified?'':'green')+'" onclick="verifyTiangProgress('+workorder.indexOf(w)+','+i+')">'+(t.verified?'Terverifikasi':'Verifikasi Pengawas')+'</button></td></tr>').join('');
    body.innerHTML='<div class="tablewrap"><table><thead><tr><th>Material Tiang</th><th>Vendor Tiang</th><th>Qty WO</th><th>Qty Terpasang</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  };
  window.updateTiangInstalled=function(wi,ti,val){const t=workorder[wi]?._tiangRows?.[ti];if(!t)return;t.installedQty=Math.max(0,Math.min(Number(t.qtyWO)||0,Number(val)||0));t.progress=Math.min(100,Math.round(t.installedQty/(Number(t.qtyWO)||1)*100));t.verified=false;renderTiangVendorProgress()};
  window.verifyTiangProgress=function(wi,ti){const t=workorder[wi]?._tiangRows?.[ti];if(!t)return;if((Number(t.installedQty)||0)<(Number(t.qtyWO)||0)){alert('Qty terpasang belum mencapai Qty WO.');return}t.verified=true;t.verifiedQty=t.installedQty;t.progress=100;renderTiangVendorProgress();alert('Progress tiang diverifikasi Pengawas.');};
})();


/* Revision 14b — Progress Tiang monitoring */
(function(){
  window.tiangProgress=function(w){
    const rows=w?._tiangRows||[];
    if(!rows.length)return 100;
    const total=rows.reduce((a,t)=>a+(Number(t.qtyWO)||0),0);
    const done=rows.reduce((a,t)=>a+(t.verified?(Number(t.installedQty)||0):0),0);
    return total?Math.min(100,Math.round(done/total*100)):100;
  };
  window.openTiangProgress=function(i){
    const w=workorder[i], rows=w?._tiangRows||[];
    if(!rows.length){alert('WO ini tidak memiliki material tiang tambahan.');return}
    const body=rows.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.vendor)+'</td><td>'+esc(t.qtyWO)+'</td><td>'+esc(t.installedQty||0)+'</td><td>'+Math.min(100,Math.round(((Number(t.installedQty)||0)/(Number(t.qtyWO)||1))*100))+'%</td><td><span class="badge '+(t.verified?'ok':'warn')+'">'+(t.verified?'Terverifikasi':'Belum Verifikasi')+'</span></td></tr>').join('');
    modal('Progress Tiang · '+esc(w['NO WO']),'<div class="notice">Progress Tiang dihitung dari <b>Qty Terpasang / Qty WO</b> dan menjadi 100% setelah diverifikasi Pengawas.</div><div class="tablewrap"><table><thead><tr><th>Material</th><th>Vendor Tiang</th><th>Qty WO</th><th>Terpasang</th><th>Progress</th><th>Status</th></tr></thead><tbody>'+body+'</tbody></table></div>','<button class="btn" onclick="closeModal()">Tutup</button>');
  };
  const _oldRenderSup=window.renderSupervisorTableV12;
  window.renderSupervisorTableV12=function(name){
    const rows=workorder.filter(w=>w.PENGAWAS===name||w.PENGAWAS_2===name).map(w=>{const i=workorder.indexOf(w);ensureJasa(w);const pm=materialProgress(w),pj=jasaProgress(w),pt=tiangProgress(w),done=combinedComplete(w);return '<tr><td>'+esc(w['NAMA PELANGGAN'])+'</td><td><b>'+esc(w['NO WO'])+'</b></td><td>'+esc(w.VENDOR)+'</td><td>'+esc(w.PENGAWAS)+'<br>'+esc(w.PENGAWAS_2||'-')+'</td><td>'+progressBar(pm,'Material','openMaterialProgressPopup('+i+')')+'</td><td>'+progressBar(pj,'Jasa','openJasaProgress('+i+')')+'</td><td>'+progressBar(pt,'Tiang','openTiangProgress('+i+')')+'</td><td><div style="min-width:180px"><input value="'+esc(w['KET KENDALA']||'')+'" placeholder="Tulis kendala..." onblur="updateWOKendala('+i+',this.value)"></div></td><td><div class="action"><button class="btn primary" onclick="openReservationForWO(\''+esc(w['NO WO'])+'\')">Reservasi</button><button class="btn" onclick="openJasaProgress('+i+')">Progress Jasa</button>'+(done?'<button class="btn green" onclick="openBAST('+i+')">BAST</button>':'')+'</div></td></tr>'}).join('');
    $('supTable12').innerHTML=table('supInner12',['Pelanggan','No WO','Vendor','Pengawas 1 / 2','Progress Material','Progress Jasa','Progress Tiang','Kendala','Action'],rows);
  };
})();

</script>
